monitor = , preferred, auto, 1

exec-once = waybar
exec-once = awww-daemon

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

exec-once = hyprctl setcursor Bibata-Modern-Classic 24


input {
    kb_layout = us, ru
    kb_options = grp:alt_shift_toggle, caps:none
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    col.active_border = rgba(7888bcff)
    col.inactive_border = rgba(121622ff)

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 2
	vibrancy = 0.2
	new_optimizations = true
        passes = 1
    }

    shadow {
        enabled = true
        range = 3
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = all, 0.03, 0.8, 0.1, 1.025
    bezier = work, 0.08, 0.8, 0.1, 1
    animation = windows, 1, 6.5, all
    animation = windowsOut, 1, 6.5, all, popin 80%
    animation = border, 1, 7, all
    animation = fade, 1, 7, all
    animation = workspaces, 1, 7, work
}

$mainMod = SUPER
$terminal = alacritty
$browser = firefox
$pleer = yandex-music
$torrent = qbittorrent
$gamelauncher = steam
$messenger = Telegram

# applications
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $gamelauncher 
bind = $mainMod, A, exec, $pleer
bind = $mainMod, S, exec, $torrent
bind = $mainMod, D, exec, $messenger

# tools
bind =  , Print, exec, ./Skripts/screenshots
bind = $mainMod, R, exec, hyprpicker -a

# control
bind = $mainMod, C, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, exit,

bind = $mainMod, l, movefocus, l
bind = $mainMod, h, movefocus, r
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioCd, exec, playerctl play-pause
